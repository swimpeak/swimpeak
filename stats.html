<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SwimPeak waitlist stats</title>
<style>
  :root{ color-scheme: dark; --aqua:#18c4d6; --aqua2:#4ee2e8; --muted:#8ea0bd; --text:#e6edf8; --soft:#cbd6e8; --bad:#ff6b7a; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:#070d1a radial-gradient(900px 500px at 50% -120px, rgba(24,196,214,.18), transparent 70%); color:var(--text);
        font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  .wrap{ max-width:760px; margin:0 auto; padding:calc(24px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom)); }
  h1{ font-size:26px; margin:0 0 4px; } h2{ font-size:17px; margin:30px 0 10px; color:var(--soft); }
  .sub{ color:var(--muted); font-size:14px; margin:0 0 20px; }
  .card{ background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:18px; }
  input{ width:100%; padding:13px; border-radius:12px; border:1px solid rgba(255,255,255,.18); background:rgba(7,13,26,.8); color:var(--text); font:inherit; }
  button{ padding:12px 18px; border:0; border-radius:12px; font:inherit; font-weight:700; color:#fff; cursor:pointer; background:linear-gradient(180deg,#3b82f6,#2563eb); }
  button.ghost{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); font-weight:600; }
  .row{ display:flex; gap:10px; margin-top:12px; }
  .err{ color:var(--bad); min-height:20px; margin-top:10px; font-size:14px; }
  .big{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .stat{ padding:16px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); text-align:center; }
  .stat b{ display:block; font-size:34px; color:var(--aqua2); line-height:1.1; } .stat span{ color:var(--muted); font-size:13px; }
  table{ width:100%; border-collapse:collapse; font-size:14.5px; }
  th,td{ text-align:left; padding:9px 8px; border-bottom:1px solid rgba(255,255,255,.08); }
  th{ color:var(--muted); font-weight:600; font-size:12.5px; } td.n, th.n{ text-align:right; font-variant-numeric:tabular-nums; }
  .scroll{ overflow-x:auto; }
  .bars{ display:flex; align-items:flex-end; gap:3px; height:120px; padding-top:8px; }
  .bar{ flex:1; background:linear-gradient(180deg,var(--aqua2),var(--aqua)); border-radius:3px 3px 0 0; min-height:2px; opacity:.9; }
  .bar.zero{ background:rgba(255,255,255,.12); }
  .axis{ display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-top:6px; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SwimPeak waitlist stats</h1>
  <p class="sub">Private. Shows counts only, never emails.</p>

  <section id="login" class="card">
    <label for="pass" class="sub" style="display:block;margin-bottom:8px;">Stats passphrase</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Your passphrase">
    <div class="row"><button id="go" type="button">Show stats</button></div>
    <div class="err" id="err" role="status" aria-live="polite"></div>
  </section>

  <section id="dash" hidden>
    <div class="row" style="margin:0 0 14px;justify-content:space-between;align-items:center;">
      <span class="sub" id="updated" style="margin:0"></span>
      <span><button class="ghost" id="refresh" type="button">Refresh</button> <button class="ghost" id="lock" type="button">Lock</button></span>
    </div>
    <div class="big">
      <div class="stat"><b id="sTotal">0</b><span>Total signups</span></div>
      <div class="stat"><b id="sToday">0</b><span>Today (UTC)</span></div>
      <div class="stat"><b id="sWeek">0</b><span>Last 7 days</span></div>
    </div>

    <h2>Signups per day (last 30 days)</h2>
    <div class="card"><div class="bars" id="bars" aria-label="Signups per day"></div><div class="axis"><span id="axL"></span><span id="axR"></span></div></div>

    <h2>By video (all platforms combined)</h2>
    <div class="card scroll"><table><thead><tr><th>Video</th><th class="n">Signups</th><th class="n">Share</th></tr></thead><tbody id="tVideo"></tbody></table></div>

    <h2>By platform</h2>
    <div class="card scroll"><table><thead><tr><th>Platform</th><th class="n">Signups</th><th class="n">Share</th></tr></thead><tbody id="tPlat"></tbody></table></div>

    <h2>Every link</h2>
    <div class="card scroll"><table><thead><tr><th>Link tag (?src=)</th><th class="n">Signups</th></tr></thead><tbody id="tSrc"></tbody></table></div>
  </section>
</div>

<script>
// Public "publishable" key (same one the waitlist page uses). On its own it cannot read anything:
// the stats function only answers when you send the correct passphrase.
const SUPABASE_URL = 'https://yqqwomftttedaaskghvj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8dSqtHMLDwyPrfn7T1KyjQ_bwOpoSqz';
const PLAT = { tt:'TikTok', ig:'Instagram', yt:'YouTube', app:'In-app share' };
const $ = (id) => document.getElementById(id);

// All text from the database goes in with textContent, never innerHTML (link tags come from public URLs).
function cell(tr, text, cls){ const td = document.createElement('td'); if(cls) td.className = cls; td.textContent = text; tr.appendChild(td); }
function fill(tbodyId, rows){
  const tb = $(tbodyId); tb.textContent = '';
  if(!rows.length){ const tr = document.createElement('tr'); cell(tr, 'No data yet'); tb.appendChild(tr); return; }
  rows.forEach(r => { const tr = document.createElement('tr'); r.forEach((v, i) => cell(tr, v, i ? 'n' : '')); tb.appendChild(tr); });
}
function parse(src){
  const m = /^([a-z]+)_d(\d{1,3})$/i.exec(src);
  if(m) return { plat: PLAT[m[1].toLowerCase()] || m[1], day: Number(m[2]) };
  if(PLAT[src]) return { plat: PLAT[src], day: null };
  return { plat: src === '(none)' ? 'No tag' : 'Other', day: null };
}
const pct = (n, t) => (t ? Math.round(n / t * 100) : 0) + '%';

function render(d){
  const total = Number(d.total) || 0;
  $('sTotal').textContent = total.toLocaleString(); $('sToday').textContent = Number(d.today).toLocaleString(); $('sWeek').textContent = Number(d.last7).toLocaleString();

  // last 30 days, filling gaps with zero
  const byDay = new Map((d.by_day || []).map(r => [String(r.day), Number(r.n)]));
  const days = []; const now = new Date(); 
  for(let i = 29; i >= 0; i--){ const dt = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() - i)); days.push(dt.toISOString().slice(0, 10)); }
  const max = Math.max(1, ...days.map(k => byDay.get(k) || 0));
  const bars = $('bars'); bars.textContent = '';
  days.forEach(k => { const n = byDay.get(k) || 0; const b = document.createElement('div'); b.className = 'bar' + (n ? '' : ' zero'); b.style.height = Math.max(2, n / max * 110) + 'px'; b.title = `${k}: ${n}`; bars.appendChild(b); });
  $('axL').textContent = days[0]; $('axR').textContent = days[days.length - 1] + ` (max ${max}/day)`;

  const src = (d.by_source || []).map(r => ({ src: String(r.source), n: Number(r.n) }));
  const vid = new Map(), plat = new Map();
  src.forEach(r => { const p = parse(r.src); plat.set(p.plat, (plat.get(p.plat) || 0) + r.n); const key = p.day == null ? 'Other / no video' : 'Day ' + p.day; vid.set(key, (vid.get(key) || 0) + r.n); });
  const sortDesc = (m) => [...m.entries()].sort((a, b) => b[1] - a[1]);
  fill('tVideo', sortDesc(vid).map(([k, n]) => [k, n.toLocaleString(), pct(n, total)]));
  fill('tPlat', sortDesc(plat).map(([k, n]) => [k, n.toLocaleString(), pct(n, total)]));
  fill('tSrc', src.map(r => [r.src, r.n.toLocaleString()]));
  $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

async function load(pass){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/waitlist_stats`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
    body: JSON.stringify({ p_pass: pass })
  });
  let data = null; try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    const text = String((data && (data.message || data.hint)) || '');
    if(text.includes('not_allowed')) throw new Error('Wrong passphrase.');
    if(res.status === 404 || text.includes('Could not find')) throw new Error('Stats function not found. Run swimpeak_stats_setup.sql in Supabase first.');
    throw new Error('Something went wrong' + (text ? ': ' + text.slice(0, 160) : '.'));
  }
  return data;
}
async function show(pass){
  $('err').textContent = '';
  try{
    render(await load(pass));
    sessionStorage.setItem('sp_stats_pass', pass);
    $('login').hidden = true; $('dash').hidden = false;
  }catch(e){ $('err').textContent = e.message; $('login').hidden = false; $('dash').hidden = true; sessionStorage.removeItem('sp_stats_pass'); }
}
$('go').addEventListener('click', () => { const p = $('pass').value; if(p) show(p); });
$('pass').addEventListener('keydown', (e) => { if(e.key === 'Enter') $('go').click(); });
$('refresh').addEventListener('click', () => show(sessionStorage.getItem('sp_stats_pass') || ''));
$('lock').addEventListener('click', () => { sessionStorage.removeItem('sp_stats_pass'); $('pass').value = ''; $('dash').hidden = true; $('login').hidden = false; });
const saved = sessionStorage.getItem('sp_stats_pass'); if(saved) show(saved);
</script>
</body>
</html>
